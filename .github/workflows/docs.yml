name: Build and Deploy Documentation

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      # @igniteui/reveal-ai-plugin is installed from git (IgniteUI/reveal-ai-plugin), which
      # lives in another org. A GitHub App installed there with Contents: read mints a
      # short-lived token for that one repo. Secrets are unavailable to fork/Dependabot
      # PRs, so this step may fail there; the plugin install is then skipped.
      - name: Create plugin repo token
        id: plugin-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.INFRA_APP_CLIENT_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: IgniteUI
          repositories: reveal-ai-plugin

      # Rewrite the plugin's git URLs (ssh form from package-lock.json, https form from
      # package.json resolution) to carry the token. Passed as env so nothing is written
      # to the runner's git config.
      - name: Install dependencies
        run: npm ci
        env:
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.plugin-token.outputs.token }}@github.com/IgniteUI/reveal-ai-plugin.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/IgniteUI/reveal-ai-plugin
          GIT_CONFIG_KEY_1: url.https://x-access-token:${{ steps.plugin-token.outputs.token }}@github.com/IgniteUI/reveal-ai-plugin.insteadOf
          GIT_CONFIG_VALUE_1: https://github.com/IgniteUI/reveal-ai-plugin

      # The AI search plugin is an optionalDependency, so a missing or unauthorized
      # install is silent. Fail loudly on the deploy path so staging/production never
      # ship without AI search. PR builds intentionally skip this: a PR must not fail
      # over plugin repo access.
      - name: Verify AI search plugin is installed
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: node -e "require.resolve('@igniteui/reveal-ai-plugin')"

      - name: Build documentation
        run: npm run build
        env:
          # Leave this repository variable unset to use static/sbom/catalog.json.
          # Production should point it at the public CDN catalog.
          SBOM_CATALOG_URL: ${{ vars.SBOM_CATALOG_URL }}

      - name: Upload build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-build
          path: build/
          retention-days: 1

  deploy:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-build
          path: build/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STAGING }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGING }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: |
          aws s3 sync build/ s3://help-staging-reveal --delete --cache-control "public, max-age=3600"

      - name: Invalidate CloudFront cache (if applicable)
        run: |
          echo "If you have CloudFront distribution, add invalidation command here"
          # aws cloudfront create-invalidation --distribution-id YOUR_DISTRIBUTION_ID --paths "/*"
